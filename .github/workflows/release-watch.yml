name: Release watch

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .cache/catalog_http
          key: catalog-http-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            catalog-http-${{ runner.os }}-

      - name: Rebuild enriched Markdown catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build_catalog.py all --source data/source/UNICAGD_programming_catalog_MASTER_FULL.json --target-records 9000

      - name: Commit catalog updates
        run: |
          if git diff --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "UNICAGD"
          git config user.email "322580518+UNICAGD@users.noreply.github.com"
          git add README.md catalog data/source tools .github/workflows
          git commit -m "Refresh programming catalog"
          git push
